name: Fast Auto-Deploy & CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Prevent queue delays: newer pushes automatically supersede older in-progress runs
concurrency:
  group: main-pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # =========================================================================
  # 1. PUSH NOTIFICATION & AUDIT (Runs immediately in parallel)
  # =========================================================================
  notify-push:
    name: Fast Push Audit & Summary
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Shallow Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Display Push Info in Action Logs
        run: |
          echo "=========================================================="
          echo ">> NEW COMMIT PUSHED TO MAIN BRANCH"
          echo "=========================================================="
          echo "Pushed by   : ${{ github.actor }}"
          echo "Author      : ${{ github.event.head_commit.author.name }} <${{ github.event.head_commit.author.email }}>"
          echo "Commit SHA  : ${{ github.sha }}"
          echo "Branch      : ${{ github.ref_name }}"
          echo "Commit Msg  : ${{ github.event.head_commit.message }}"
          echo "Timestamp   : ${{ github.event.head_commit.timestamp }}"
          echo "Commit URL  : ${{ github.event.head_commit.url }}"
          echo "=========================================================="
          echo "Changed files in this commit:"
          git diff-tree --no-commit-id --name-status -r ${{ github.sha }} || true
          echo "=========================================================="

      - name: Generate GitHub Actions Step Summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # 🚀 Auto-Deploy Pipeline Triggered for `main`

          ### 👤 Commit & Author Information
          | Field | Value |
          |---|---|
          | **Pushed By** | **@${{ github.actor }}** |
          | **Author** | `${{ github.event.head_commit.author.name }} <${{ github.event.head_commit.author.email }}>` |
          | **Commit Message** | `${{ github.event.head_commit.message }}` |
          | **Commit SHA** | [`${{ github.sha }}`](${{ github.event.head_commit.url }}) |
          | **Branch** | `${{ github.ref_name }}` |
          | **Timestamp** | `${{ github.event.head_commit.timestamp }}` |

          ### 📦 Changed Files
          ```text
          EOF
          git diff-tree --no-commit-id --name-status -r ${{ github.sha }} >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Initial commit or no diff" >> $GITHUB_STEP_SUMMARY
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ```

          ---
          > ⚡ *Executed automatically with zero queue delay (superseded runs automatically cancelled).*
          EOF

  # =========================================================================
  # 2. FAST CI SANITY & BUILD CHECKS (Runs in parallel with deployment)
  # =========================================================================
  validate-build:
    name: Fast CI Sanity & Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Shallow Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
          echo "Docker compose configuration is valid."

      - name: Validate Python Syntax (Backend, Identity, Storage Gateway)
        run: |
          python3 -m compileall -q backend identity_service storage_gateway
          echo "Python code compilation passed without syntax errors."

      - name: Detect Changed Subsystems
        id: filter
        run: |
          CHANGED=$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }} 2>/dev/null || true)
          if echo "$CHANGED" | grep -E '^frontend/'; then
            echo "frontend_changed=true" >> $GITHUB_OUTPUT
            echo "Frontend files modified: running Next.js build verification."
          else
            echo "frontend_changed=false" >> $GITHUB_OUTPUT
            echo "No frontend changes: skipping frontend build (0s saved)."
          fi

      - name: Setup Node.js (Only if frontend changed)
        if: steps.filter.outputs.frontend_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Next.js Build
        if: steps.filter.outputs.frontend_changed == 'true'
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**/*') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Frontend Build Verification
        if: steps.filter.outputs.frontend_changed == 'true'
        run: |
          cd frontend
          npm ci --prefer-offline --no-audit
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          DJANGO_API_URL: http://127.0.0.1:8000
          STORAGE_GATEWAY_URL: http://127.0.0.1:9000
          IDENTITY_SERVICE_URL: http://127.0.0.1:8100

      - name: Record CI Verification Status
        if: always()
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ### 🛡️ Fast CI Verification Status
          - **Docker Compose**: Configuration verified valid
          - **Python Syntax**: All services syntax-checked
          - **Frontend Next.js**: ${{ steps.filter.outputs.frontend_changed == 'true' && 'Incremental build verified' || 'Untouched (skipped)' }}
          EOF

  # =========================================================================
  # 3. INSTANT ZERO-LAG LIVE DEPLOYMENT (Self-Hosted Runner)
  # Executes immediately on the target server/workstation in seconds!
  # =========================================================================
  deploy-live:
    name: Instant Live Server Deploy
    runs-on: self-hosted
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Execute Fast Zero-Lag Deployment
        shell: powershell
        run: |
          Write-Host "=========================================================="
          Write-Host ">> TRIGGERING INSTANT ZERO-LAG LIVE DEPLOYMENT"
          Write-Host "Commit: ${{ github.sha }}"
          Write-Host "Author: ${{ github.actor }}"
          Write-Host "=========================================================="

          # 1. Resolve project directory dynamically
          $candidatePaths = @(
              $env:DEPLOY_PATH,
              $env:GITHUB_WORKSPACE,
              "c:\Users\ASUS\RemoteDigitalEval",
              "c:\Users\ASUS\remote-digital",
              "c:\Users\91895\Digital-Evaluation",
              $PWD.Path
          )

          $deployDir = $null
          foreach ($p in $candidatePaths) {
              if ($p -and (Test-Path "$p\docker-compose.yml")) {
                  $deployDir = (Resolve-Path $p).Path
                  break
              }
          }

          if (-not $deployDir) {
              Write-Error "Deployment directory containing docker-compose.yml not found."
              exit 1
          }

          Set-Location -Path $deployDir
          Write-Host "[DIR] Target Deployment Directory: $deployDir"

          # 2. Invoke optimized deploy script
          $scriptPath = Join-Path $deployDir "scripts\deploy_live.ps1"
          if (Test-Path $scriptPath) {
              & $scriptPath -TargetCommit "${{ github.sha }}" -BaseCommit "${{ github.event.before }}" -DeployPath $deployDir
          } else {
              # Fallback fast-sync
              git fetch origin main --quiet
              git reset --hard origin/main
              $env:DOCKER_BUILDKIT = "1"
              $env:COMPOSE_DOCKER_CLI_BUILD = "1"
              docker compose up -d
          }

      - name: Record Live Deployment Summary
        if: always()
        shell: powershell
        run: |
          if ($env:GITHUB_STEP_SUMMARY) {
              @"
          ### ⚡ Live Server Auto-Deployment Status
          - **Triggered By**: @${{ github.actor }}
          - **Commit**: [`${{ github.sha }}`](${{ github.event.head_commit.url }})
          - **Strategy**: Smart targeted delta update (BuildKit layer caching)
          - **User Impact**: Zero lag / zero downtime (services updated in seconds)
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
